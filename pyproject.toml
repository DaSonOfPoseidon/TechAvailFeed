[project]
name = "techavailfeed"
version = "0.1.0"
description = "Ingests MBS scheduled tech-availability CSV emails into Postgres (feasibility harness)"
requires-python = ">=3.12"
# tzdata: the slim image has no system zoneinfo.
dependencies = [
    "fastapi>=0.142.2",
    "psycopg[binary]>=3.2",
    "tzdata",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "black>=24",
    "httpx2>=2.13.1",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
